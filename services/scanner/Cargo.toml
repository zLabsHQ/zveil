[package]
name = "zveil-scanner"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"

# Real chain mode (src/chain.rs): librustzcash pre-release set, Ironwood-aware
# (NU6.3). zcash_address 0.14 avoids the yanked core2 0.3 dependency that
# blocked the 0.9 line. zcash_client_sqlite is present for the future WalletDb
# path (spend tracking / positions); detection today is WalletDb-free.
zcash_client_backend = { version = "0.25.0-pre.1", features = ["lightwalletd-tonic"] }
zcash_client_sqlite = "0.23.0-pre.1"
zcash_keys = { version = "0.17.0-pre.1", features = ["unstable"] }
zcash_address = "0.14.0-pre.1"
zcash_protocol = { version = "0.11.0-pre.0", features = ["local-consensus"] }
orchard = "0.16.0"
zip32 = "0.3.0"
tonic = { version = "0.14", features = ["transport"] }
